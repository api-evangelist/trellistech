aid: trellistech
name: Trellis
description: >-
  Trellis (Trellistech) is a Y Combinator-backed, AI-powered property operations
  platform for short-term and vacation rental operators. Trellis deploys AI agents
  across an operator's entire business - handling guest communications, coordinating
  field teams, and running day-to-day operations such as tasks, workforce scheduling,
  accounting, reviews, and the guest portal. For developers, Trellis publishes a
  versioned public REST API for CRUD access to tasks and properties, an official
  hosted MCP server (@trellistech/mcp-server) that exposes operational read and gated
  write tools to any MCP-compatible AI client, and connectors for property and finance
  systems including Guesty, Hostaway, Breezeway, Calry, Krossbooking, and Ramp.
