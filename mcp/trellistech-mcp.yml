generated: '2026-07-21'
method: searched
source: https://docs.trellistech.com/api-reference/mcp-server
name: Trellis MCP Server
status: published
status_raw: official
description: >-
  Official Trellis Model Context Protocol server. Lets external AI clients use Trellis
  operational tools through a standard MCP connection - a hosted Streamable HTTP endpoint,
  or a stdio bridge from the @trellistech/mcp-server npm package for clients that do not
  support Streamable HTTP.
transports:
- type: streamable-http
  hosted: true
  endpoint: https://api.trellistech.com/v1/mcp-server
  auth: 'Bearer workspace API key (Authorization: Bearer trls_...)'
- type: stdio
  package: '@trellistech/mcp-server'
  command: npx -y @trellistech/mcp-server stdio
  env:
  - TRELLIS_API_KEY
  - TRELLIS_MCP_URL
authentication:
  scheme: bearer
  credential: Workspace-scoped Trellis API key (trls_...) created in Settings > Developer
  detail: authentication/trellistech-authentication.yml
workspace_scoping: >-
  Every tool accepts an optional workspace_id argument. Left empty it uses the workspace
  the API key was issued for; if provided it must match the key's workspace or the call is
  rejected. Operate on multiple workspaces by issuing one key per workspace and connecting
  each as a separate MCP server.
install:
- client: claude-code
  command: npx -y @trellistech/mcp-server install claude-code
- client: claude-desktop
  command: npx -y @trellistech/mcp-server print-config claude-desktop
- client: claude-hosted
  command: npx -y @trellistech/mcp-server print-config claude-hosted
- client: cursor / codex
  command: Prepared from Trellis Settings > Developer
tool_catalog:
  discovery: npx -y @trellistech/mcp-server doctor  (or the client tool list)
  domains:
  - tasks
  - properties
  - reservations
  - conversations
  - workforce
  - knowledge base
  - automations
  note: >-
    Catalog mirrors Trellis operational read tools and gated write tools. Exact tool
    list is enumerated at runtime by the hosted server; not statically published.
resources:
- uri: trellis://agents/{agent_id}/profile
  description: Agent profile and configuration
- uri: trellis://agents/{agent_id}/memory
  description: Recent agent memory
- uri: trellis://knowledge/documents/{document_id}
  description: Workspace knowledge documents
- uri: trellis://knowledge/skills/{document_id}
  description: Agent-facing skills
safety_model:
- Read tools work immediately after authentication.
- Write tools keep the same permission and confirmation behavior as the Trellis app.
- Messaging tools must show the payload and wait for explicit confirmation before sending.
- Every tool call is logged with workspace_id, user_id, and tool_name.
- The hosted endpoint applies basic per-key rate limiting.
package:
  registry: npm
  name: '@trellistech/mcp-server'
  version: 0.1.0
  license: MIT
  detail: packages/trellistech-packages.yml
