openapi: 3.1.0
info:
  title: Trellis Public API v1 properties API
  version: 1.4.0
  description: Public, versioned REST contracts for workspace-scoped Trellis tasks and properties. Authenticate with an existing workspace API key.
servers:
- url: /
  description: Current host
tags:
- name: properties
  description: Trellis property contracts generated from Hono/Zod schemas.
paths:
  /api/v1/workspaces/{workspaceId}/properties:
    get:
      tags:
      - properties
      summary: List properties
      description: Returns non-deleted Trellis properties for the authenticated workspace. Use `status` or `q` to narrow the result set.
      security:
      - WorkspaceApiKey: []
      parameters:
      - schema:
          type: string
          minLength: 1
          example: haven-vacation-rentals
        required: true
        name: workspaceId
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          example: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type:
          - integer
          - 'null'
          minimum: 0
          default: 0
          example: 0
          description: Number of items to skip.
        required: false
        description: Number of items to skip.
        name: offset
        in: query
      - schema:
          allOf:
          - $ref: '#/components/schemas/PropertyStatus'
          - description: Filter properties by lifecycle status.
            example: ACTIVE
        required: false
        description: Filter properties by lifecycle status.
        name: status
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 120
          description: Case-insensitive search over name, internal code, and city.
        required: false
        description: Case-insensitive search over name, internal code, and city.
        name: q
        in: query
      responses:
        '200':
          description: Properties in the workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPropertiesResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - properties
      summary: Create a property
      description: Creates a Trellis property in the authenticated workspace.
      security:
      - WorkspaceApiKey: []
      parameters:
      - schema:
          type: string
          minLength: 1
          example: haven-vacation-rentals
        required: true
        name: workspaceId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePropertyRequest'
      responses:
        '201':
          description: The created property.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutatePropertyResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/workspaces/{workspaceId}/properties/{propertyId}:
    get:
      tags:
      - properties
      summary: Get a property
      description: Returns one non-deleted Trellis property by id within the authenticated workspace.
      security:
      - WorkspaceApiKey: []
      parameters:
      - schema:
          type: string
          minLength: 1
          example: haven-vacation-rentals
        required: true
        name: workspaceId
        in: path
      - schema:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        required: true
        name: propertyId
        in: path
      responses:
        '200':
          description: The requested property.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPropertyResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags:
      - properties
      summary: Replace property fields
      description: Applies the supplied property fields using the same mutation behavior as PATCH. Omitted fields are left unchanged.
      security:
      - WorkspaceApiKey: []
      parameters:
      - schema:
          type: string
          minLength: 1
          example: haven-vacation-rentals
        required: true
        name: workspaceId
        in: path
      - schema:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        required: true
        name: propertyId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePropertyRequest'
      responses:
        '200':
          description: The updated property.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutatePropertyResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
      - properties
      summary: Delete a property
      description: Soft-deletes a Trellis property in the authenticated workspace.
      security:
      - WorkspaceApiKey: []
      parameters:
      - schema:
          type: string
          minLength: 1
          example: haven-vacation-rentals
        required: true
        name: workspaceId
        in: path
      - schema:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        required: true
        name: propertyId
        in: path
      responses:
        '200':
          description: The property was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePropertyResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags:
      - properties
      summary: Update a property
      description: Updates a Trellis property in the authenticated workspace.
      security:
      - WorkspaceApiKey: []
      parameters:
      - schema:
          type: string
          minLength: 1
          example: haven-vacation-rentals
        required: true
        name: workspaceId
        in: path
      - schema:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        required: true
        name: propertyId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePropertyRequest'
      responses:
        '200':
          description: The updated property.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutatePropertyResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
